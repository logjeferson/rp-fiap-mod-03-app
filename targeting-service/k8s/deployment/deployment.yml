apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-deployment
  namespace: "eks-namespace"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      initContainers:
      - name: targeting-db-migration
        image: postgres:15-alpine
        command:
        - /bin/sh
        - -c
        - |
          echo "Iniciando criacao da tabela no banco targeting_db..."
          psql $DATABASE_URL <<'EOF'
          CREATE TABLE IF NOT EXISTS targeting_rules (
              id SERIAL PRIMARY KEY,

              -- 'flag_name' é a chave de negócio única. 
              -- Cada flag pode ter no máximo UMA regra de segmentação.
              flag_name VARCHAR(100) UNIQUE NOT NULL,
              
              -- Se a regra de segmentação em si está ativa ou não
              is_enabled BOOLEAN NOT NULL DEFAULT true,
              
              -- Armazena a lógica da regra como um JSON.
              -- Ex: {"type": "PERCENTAGE", "value": 50}
              -- Ex: {"type": "USER_LIST", "values": ["u1", "u2"]}
              rules JSONB NOT NULL,
              
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          -- Trigger para atualizar 'updated_at' automaticamente (igual ao do flag-service)
          CREATE OR REPLACE FUNCTION trigger_set_timestamp()
          RETURNS TRIGGER AS $$
          BEGIN
            NEW.updated_at = NOW();
            RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;

          DROP TRIGGER IF EXISTS set_timestamp ON targeting_rules;

          CREATE TRIGGER set_timestamp
          BEFORE UPDATE ON targeting_rules
          FOR EACH ROW
          EXECUTE PROCEDURE trigger_set_timestamp();
          EOF
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: targeting-secret
              key: DATABASE_URL
      containers:
        - name: targeting-container
          image: 162521700965.dkr.ecr.us-east-1.amazonaws.com/ecr-targeting-service-01:v1.0.27783babc1938863fe827131625f4e90418b05dd
          ports:
            - containerPort: 8003
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: targeting-config
                  key: AUTH_SERVICE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: targeting-secret
                  key: DATABASE_URL