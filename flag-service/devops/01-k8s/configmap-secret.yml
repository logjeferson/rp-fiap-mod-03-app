apiVersion: v1
kind: Namespace
metadata:
  name: "#{namespace}#"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-config
  namespace: "#{namespace}#"
data:
  AUTH_SERVICE_URL: "http://auth-service.#{namespace}#.svc.cluster.local:8001"

---
apiVersion: v1
kind: Secret
metadata:
  name: flag-secret
  namespace: "#{namespace}#"
type: Opaque
stringData:
  DATABASE_URL: "postgres://#{db_user}#:#{db_pass}#@#{rds_flag}#/flags_db"