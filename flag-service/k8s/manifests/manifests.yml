apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-config
  namespace: "#{namespace}#"
data:
  AUTH_SERVICE_URL: "http://auth-service.eks-namespace.svc.cluster.local:8001"

---
apiVersion: v1
kind: Secret
metadata:
  name: flag-secret
  namespace: "#{namespace}#"
type: Opaque
stringData:
  DATABASE_URL: "postgres://#{db_user}#:#{db_pass}#@#{rds_endpoint}#/flags_db?sslmode=require"

---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: "#{namespace}#"
spec:
  type: ClusterIP
  selector:
    app: flag-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002