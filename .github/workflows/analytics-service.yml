name: FIAP - MODULO 03 - APP - ANALYTICS SERVICE

on:
  push:
    branches:
      - main
    paths:
      - 'analytics-service/**'
  workflow_dispatch:

env:
  SERVICE_NAME: 'analytics-service'
  ECR_REPOSITORY_NAME: 'ecr-analytics-service-01'
  EKS_NAMESPACE: 'eks-namespace'
  PYTHON_VERSION: '3.11'

jobs:
  sca:
    name: SCA - TRIVY - FILE SYSTEM SCAN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy - Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ github.workspace }}/${{ env.SERVICE_NAME }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'

  sast:
    name: SAST - SONARCLOUD - CODE ANALYSIS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud - Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ env.SERVICE_NAME }}
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectName=${{ github.event.repository.name }}/${{ env.SERVICE_NAME }}
            -Dsonar.projectKey=${{ github.event.repository.name }}_${{ env.SERVICE_NAME }}
            -Dsonar.python.version=${{ env.PYTHON_VERSION }}
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,**/*.test.js,**/*.spec.js,**/*.d.ts,**/*.json,**/*.yml,**/*.yaml,**/*.md

  build-and-test:
    name: BUILD, LINT AND UNIT TESTS - SERVICE - ANALYTICS
    needs: [sca, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Python - Setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Python - Install Dependencies
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Flake8 - Linter
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-line-length=120 --statistics

      - name: Python - Run - Unit Tests
        working-directory: ${{ env.SERVICE_NAME }}
        run: pytest

  docker-build:
    name: DOCKER BUILD - SERVICE - ANALYTICS
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: AWS Credentials - Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR - Connect
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ECR - Build and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          cd ${{ env.SERVICE_NAME }}

          echo "##[section]Building the Docker Image..."
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:$IMAGE_TAG -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:latest .

          echo "##[section]Pushing Image to ECR..."
          docker push -a $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}

      - name: Trivy - Container Scan
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'

  deploy:
    name: DEPLOY - SERVICE - ANALYTICS
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EKS_CLUSTER_NAME: 'eks-cluster-01'
      AWS_SQS_NAME: 'EventQueue'
      AWS_EVALUATION_ROLE_NAME: 'evaluation-service-role'
      AWS_ANALYTICS_ROLE_NAME: 'analytics-service-role'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: AWS Credentials - Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: EKS Cluster - Setup
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: EKS Cluster - Connect
        run: |
          echo "============= EKS Cluster - Connect =============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Connecting to the EKS Cluster..."
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: ECR - Connect
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: EKS Cluster - Create Dependencies
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          echo "======= EKS Cluster - Create Dependencies ========"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Getting SQS URL..."
          SQS_URL=$(aws sqs get-queue-url \
            --queue-name ${{ env.AWS_SQS_NAME }} \
            --query "QueueUrl" \
            --output text)
          echo "##[section]SQS URL found: $SQS_URL"

          echo "##[section]Getting IAM Role ARN..."
          EVALUATION_ROLE_ARN=$(aws iam get-role \
            --role-name ${{ env.AWS_EVALUATION_ROLE_NAME }} \
            --query "Role.Arn" \
            --output text)
          echo "##[section]IAM Role ARN found: $EVALUATION_ROLE_ARN"

          echo "##[section]Getting IAM Role ARN..."
          ANALYTICS_ROLE_ARN=$(aws iam get-role \
            --role-name ${{ env.AWS_ANALYTICS_ROLE_NAME }} \
            --query "Role.Arn" \
            --output text)
          echo "##[section]IAM Role ARN found: $ANALYTICS_ROLE_ARN"

          echo "##[section]Applying Manifests..."
          cd ${{ env.SERVICE_NAME }}
          sed -i "s|#{namespace}#|${{ env.EKS_NAMESPACE }}|g" k8s/manifests/manifests.yml
          sed -i "s|#{aws_sqs_url}#|$SQS_URL|g" k8s/manifests/manifests.yml
          sed -i "s|#{aws_evaluation_role_arn}#|$EVALUATION_ROLE_ARN|g" k8s/manifests/manifests.yml
          sed -i "s|#{aws_analytics_role_arn}#|$ANALYTICS_ROLE_ARN|g" k8s/manifests/manifests.yml
          kubectl apply -f k8s/manifests/manifests.yml

      - name: GitOps - Tag Update
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          cd ${{ env.SERVICE_NAME }}

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          sed -i "s|#{namespace}#|${{ env.EKS_NAMESPACE }}|g" k8s/deployment/deployment.yml
          sed -i "s|image: .*/${{ env.ECR_REPOSITORY_NAME }}:.*|image: $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:$IMAGE_TAG|g" k8s/deployment/deployment.yml
          
          git add k8s/deployment/deployment.yml
          git commit -m "chore(gitops): atualiza imagem do ${{ env.SERVICE_NAME }} para a tag $IMAGE_TAG [skip ci]"
          for i in {1..5}; do
            git pull --rebase origin main && \
            git push origin main && \
            break || \
            echo "Conflito de push detectado. Outro serviço atualizou o repositório. Tentando novamente em 5 segundos..." && \
            sleep 5
          done

  keda-load-test:
    name: TEST - SERVICE - ANALYTICS
    runs-on: ubuntu-latest
    needs: deploy
    environment: 'APPLY_APPROVAL'
    steps:
      - name: KEDA - Load Test
        run: |
          BASE_URL="https://apis.mysandbox.com.br/evaluation/evaluate"
          FLAG_NAME="enable-new-dashboard"

          echo "Iniciando o envio de 150 requisições para a API..."
          for i in {1..150}; do
            TARGET_URL="${BASE_URL}?user_id=user-${i}&flag_name=${FLAG_NAME}"
            echo -n "Chamando API para user-${i} ... Status HTTP: "
            curl -s -L -o /dev/null -w "%{http_code}\n" "$TARGET_URL"
            sleep 0.3 
          done
          echo "Teste de carga finalizado com sucesso!"