name: FIAP - MODULO 03 - APP - TARGETING SERVICE

on:
  push:
    branches:
      - main
    paths:
      - 'targeting-service/**'
  workflow_dispatch:

env:
  SERVICE_NAME: 'targeting-service'
  ECR_REPOSITORY_NAME: 'ecr-targeting-service-01'
  PYTHON_VERSION: '3.11'

jobs:
  sca:
    name: SCA - TRIVY - FILE SYSTEM SCAN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy - Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ github.workspace }}/${{ env.SERVICE_NAME }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'

  sast:
    name: SAST - SONARCLOUD - CODE ANALYSIS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud - Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ env.SERVICE_NAME }}
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectName=${{ github.event.repository.name }}/${{ env.SERVICE_NAME }}
            -Dsonar.projectKey=${{ github.event.repository.name }}_${{ env.SERVICE_NAME }}
            -Dsonar.python.version=${{ env.PYTHON_VERSION }}
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts,**/*.test.js,**/*.spec.js,**/*.d.ts,**/*.json,**/*.yml,**/*.yaml,**/*.md

  build-and-test:
    name: BUILD, LINT AND UNIT TESTS - SERVICE - TARGETING
    needs: [sca, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Python - Setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Python - Install Dependencies
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Flake8 - Linter
        working-directory: ${{ env.SERVICE_NAME }}
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-line-length=120 --statistics

      # - name: Python - Run - Unit Tests
      #   working-directory: ${{ env.SERVICE_NAME }}
      #   run: pytest

  docker-build:
    name: DOCKER BUILD - SERVICE - TARGETING
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: AWS Credentials - Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR - Connect
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: ECR - Build and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        run: |
          cd ${{ env.SERVICE_NAME }}

          echo "##[section]Building the Docker Image..."
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:$IMAGE_TAG -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}:latest .

          echo "##[section]Pushing Image to ECR..."
          docker push -a $ECR_REGISTRY/${{ env.ECR_REPOSITORY_NAME }}

      - name: Trivy - Container Scan
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 'v1.0.${{ github.sha }}'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '${{ github.workspace }}/${{ env.SERVICE_NAME }}/.trivyignore'