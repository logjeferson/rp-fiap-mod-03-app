apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: eks-namespace
type: Opaque
stringData:
  MASTER_KEY: "admin-secreto-123"
  DATABASE_URL: "postgres://__DB_USER__:__DB_PASS__@__RDS_ENDPOINT__/auth_db?sslmode=require"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: eks-namespace
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001