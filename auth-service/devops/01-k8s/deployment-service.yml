apiVersion: v1
kind: Namespace
metadata:
  name: "#{namespace}#"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: "#{namespace}#"
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: "#{namespace}#"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
      - name: auth-db-migration
        image: postgres:15-alpine
        command:
        - /bin/sh
        - -c
        - |
          echo "Iniciando criacao das tabelas no banco auth_db..."
          psql $DATABASE_URL <<'EOF'
          CREATE TABLE IF NOT EXISTS api_keys (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              key_hash VARCHAR(64) NOT NULL UNIQUE, 
              is_active BOOLEAN DEFAULT true,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );
          EOF
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: DATABASE_URL
      containers:
        - name: auth-container
          image: "#{ecr_auth}#:latest"
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: MASTER_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DATABASE_URL